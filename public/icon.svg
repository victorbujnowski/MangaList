<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="MangaList">
  <!-- Fundo "tinta" a sangria total (seguro para ícone maskable). -->
  <rect width="512" height="512" fill="#141414"/>
  <!-- Três lombadas numa estante; a do meio, em vermelho, é a obra "em leitura". -->
  <g transform="translate(0 6)">
    <rect x="150" y="146" width="58" height="214" fill="#F4F1EA"/>
    <rect x="227" y="118" width="58" height="242" fill="#D7263D"/>
    <rect x="304" y="164" width="58" height="196" fill="#F4F1EA" transform="rotate(8 333 360)"/>
    <rect x="150" y="174" width="58" height="6" fill="#141414"/>
    <rect x="227" y="146" width="58" height="6" fill="#141414"/>
    <rect x="128" y="360" width="256" height="10" fill="#F4F1EA"/>
  </g>
</svg>
