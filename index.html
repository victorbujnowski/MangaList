<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Seu catálogo pessoal de mangás, webtoons, manhwas e manhuas: acompanhe capítulos e compartilhe sua lista." />
    <meta name="robots" content="index, follow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MangaList</title>

    <!-- Preview de link (Open Graph / Twitter). Para um card grande, forneça um
         /og.png de 1200x630 e troque twitter:card para summary_large_image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MangaList" />
    <meta property="og:title" content="MangaList: seu catálogo pessoal de mangás" />
    <meta property="og:description" content="Acompanhe seus mangás, webtoons, manhwas e manhuas capítulo por capítulo. Compartilhe sua lista por link." />
    <meta property="og:image" content="/icon.svg" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MangaList: seu catálogo pessoal de mangás" />
    <meta name="twitter:description" content="Acompanhe seus mangás, webtoons, manhwas e manhuas capítulo por capítulo. Compartilhe sua lista por link." />
    <meta name="twitter:image" content="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Aplica o tema salvo antes do primeiro paint (evita "piscar" claro→escuro). -->
    <!--    Arquivo externo (não inline) para respeitar a CSP script-src 'self'. -->
    <script src="/theme-init.js"></script>

    <!-- Tela de abertura enquanto o JS baixa. Mesma animação do componente
         Loader (src/components/ui/Loader.module.css): mantenha em sincronia.
         O React substitui o conteúdo de #root ao montar. -->
    <style>
      html { background: #f4f1ea; color: #141414; }
      html[data-theme='dark'] { background: #131211; color: #ede8de; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        animation: bootIn 240ms ease-out 150ms both;
      }
      #boot rect { fill: currentColor; transform-box: fill-box; transform-origin: 50% 100%;
        animation: bootShelve 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      #boot .b2 { fill: #d7263d; animation-delay: 140ms; }
      html[data-theme='dark'] #boot .b2 { fill: #ea4b5c; }
      #boot .b3 { transform-origin: 100% 100%; animation-name: bootTilt; animation-delay: 280ms; }
      #boot .shelf { opacity: 0.35; animation: none; }
      @keyframes bootIn { from { opacity: 0; } }
      @keyframes bootShelve {
        0%, 100% { transform: scaleY(0.15); opacity: 0.25; }
        35%, 65% { transform: scaleY(1); opacity: 1; }
      }
      @keyframes bootTilt {
        0%, 100% { transform: scaleY(0.15) rotate(0deg); opacity: 0.25; }
        35% { transform: scaleY(1) rotate(0deg); opacity: 1; }
        55%, 65% { transform: scaleY(1) rotate(8deg); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot rect { animation: bootBreathe 1.6s ease-in-out infinite; }
        #boot .b3 { transform: rotate(8deg); }
        @keyframes bootBreathe { 50% { opacity: 0.4; } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-label="Carregando MangaList">
        <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true" style="overflow: visible">
          <rect class="b1" x="3" y="6" width="5" height="15" />
          <rect class="b2" x="9.5" y="3" width="5" height="18" />
          <rect class="b3" x="16" y="7" width="5" height="14" />
          <rect class="shelf" x="1.5" y="21" width="21" height="1.2" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
